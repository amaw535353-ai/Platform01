[project]
name = "zero-trust-agentic-rag-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.116.1", "pydantic==2.11.7", "sqlalchemy==2.0.43", "uvicorn==0.35.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.10", "mypy==1.17.1", "bandit==1.8.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

