[project]
name = "zero-trust-agentic-rag-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.116.1", "pydantic==2.11.7", "sqlalchemy==2.0.43", "uvicorn==0.35.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.10", "mypy==1.17.1", "bandit==1.8.6", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
