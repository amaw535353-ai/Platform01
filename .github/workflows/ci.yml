name: security-ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy packages
      - run: uv run pytest --cov=packages --cov-report=xml
      - run: uv run bandit -q -r packages apps services
      - run: uv run python attack-lab/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: security-evidence, path: "evidence/"}
  supply-chain-design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      - name: Filesystem scan and SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with: {scan-type: fs, format: cyclonedx, output: evidence/sbom.cdx.json}

